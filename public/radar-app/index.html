<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Radar comercial · Dartpac</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Dartpac Outreach · Premium. Un solo tema oscuro, elegido a propósito: azul marino en degradé, vidrio esmerilado y un acento azul cielo. */
:root{
  color-scheme:dark;
  --dp-n0:#030A17; --dp-n1:#06152B; --dp-n2:#0B2545; --dp-n3:#13315C; --dp-n4:#1D4A82;
  --dp-bg-grad:radial-gradient(1100px 760px at 12% -12%,rgba(46,112,214,.34),transparent 62%),radial-gradient(900px 640px at 105% -6%,rgba(30,92,180,.28),transparent 58%),linear-gradient(180deg,#0B2545 0%,#081C38 48%,#040D1E 100%);
  --dp-glass:rgba(17,40,76,.56); --dp-glass-2:rgba(23,52,96,.66); --dp-glass-3:rgba(31,66,118,.74);
  --dp-line:rgba(160,195,255,.14); --dp-line-2:rgba(160,195,255,.26);
  --dp-fg:#F3F7FD; --dp-muted:#A6B9D5; --dp-faint:#869FC4;
  --dp-accent:#4DA3FF; --dp-accent-2:#8CC9FF; --dp-accent-grad:linear-gradient(180deg,#2F7FF5 0%,#1859CF 100%); --dp-accent-ink:#FFFFFF;
  --dp-accent-soft:rgba(77,163,255,.16);
  --dp-ok:#3DDC97; --dp-warn:#FFC861; --dp-bad:#FF6F6F; --dp-hot:#FFB347; --dp-wa:#25D366;
  --dp-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",Roboto,system-ui,sans-serif;
  --dp-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,system-ui,sans-serif;
  --dp-mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  --dp-r-xl:28px; --dp-r-lg:24px; --dp-r:16px; --dp-r-sm:12px;
  --dp-shadow:0 30px 60px -32px rgba(0,0,0,.72),inset 0 1px 0 rgba(255,255,255,.06);
  --dp-shadow-sm:0 12px 28px -18px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.05);
  --dp-blur:blur(22px) saturate(1.6);
  --dp-ease:cubic-bezier(.2,.8,.2,1); --dp-ease-out:cubic-bezier(.16,1,.3,1); --dp-spring:cubic-bezier(.34,1.4,.64,1);
  --side-w:252px;
  /* alias que usan las vistas de Outreach */
  --bg:var(--dp-n1); --fg:var(--dp-fg); --muted:var(--dp-muted); --line:var(--dp-line);
  --accent:var(--dp-accent); --ok:var(--dp-ok); --warn:var(--dp-warn); --bad:var(--dp-bad);
  --display:var(--dp-display); --body:var(--dp-body); --mono:var(--dp-mono);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
html{background:var(--dp-n0)}
body{background:var(--dp-n0);color:var(--dp-fg);font:15px/1.45 var(--dp-body);letter-spacing:-.005em;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
::selection{background:rgba(77,163,255,.35)}

/* fondo: degradé azul marino con luces suaves (quietas: así el vidrio no se recalcula en cada cuadro) */
.dp-bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:linear-gradient(180deg,#0B2545 0%,#081C38 48%,#040D1E 100%)}
.dp-bg i{position:absolute;width:86vmax;height:86vmax;border-radius:50%}
.dp-bg i:nth-child(1){left:-34vmax;top:-48vmax;background:radial-gradient(closest-side,rgba(52,122,230,.40),rgba(52,122,230,0))}
.dp-bg i:nth-child(2){right:-38vmax;top:-36vmax;background:radial-gradient(closest-side,rgba(30,96,196,.32),rgba(30,96,196,0))}
.dp-bg i:nth-child(3){left:10vmax;bottom:-62vmax;background:radial-gradient(closest-side,rgba(20,60,130,.30),rgba(20,60,130,0))}


/* el Radar ocupa toda la ventana (la plataforma lo muestra al lado de su menú) */
html,body{height:100%;margin:0;overflow:hidden}
#rdr{position:fixed;inset:0;overflow:hidden;transform:translateZ(0);container:rdr / size;z-index:1}

/* volver a Outreach: la flecha aparece cuando la plataforma esconde su menú (celular) */
#rdr .brand-back{-webkit-appearance:none;appearance:none;background:none;border:0;padding:0;margin:0;text-align:left;border-radius:14px;-webkit-tap-highlight-color:transparent}
#rdr .brand-back .brand-tx{display:block;min-width:0}
#rdr .brand-back .bk{display:none}
#rdr .brand-back .brand-mark{transition:transform .2s}
#rdr .brand-back:active .brand-mark{transform:scale(.93)}
body.dp-solo #rdr .brand-back{gap:7px}
body.dp-solo #rdr .brand-back .bk{display:grid;place-items:center;width:18px;height:40px;margin-left:-3px;color:var(--accent-2);flex:none}
body.dp-solo #rdr .brand-back .bk svg{width:20px;height:20px}
/* accesos a Outreach en «Más» */
#rdr .mas-out-h{margin:18px 4px 10px}
#rdr .mas-out{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
#rdr .mas-o{display:flex;flex-direction:column;align-items:center;gap:7px;padding:13px 6px 11px;border-radius:16px;border:1px solid var(--line);background:var(--glass);color:var(--fg);font:600 12.5px/1.2 var(--body);transition:border-color .2s,background .2s,transform .15s}
#rdr .mas-o svg{width:22px;height:22px;color:var(--accent-2)}
#rdr .mas-o:hover{border-color:var(--line2);background:rgba(255,255,255,.06)}
#rdr .mas-o:active{transform:scale(.97)}
</style>
<style>
/* Radar Comercial DARTPAC (encapsulado en #rdr) */
:root #rdr{--bg:#060C13; --bg2:#0A1520; --glass:rgba(12,22,33,.72); --surface:#0F1A26; --raise:#152331; --line:rgba(150,180,210,.16); --line2:rgba(150,180,210,.28);
  --fg:#EDF3F8; --muted:#8FA3B5; --accent:#2F80F7; --accent-2:#8CC9FF; --accent-ink:#FFFFFF; --sea:#46B3F0; --sea-deep:#123B5C;
  --ok:#3DD68C; --warn:#F5BD4F; --bad:#FF6B5B;
  --display:"Sora","Segoe UI",system-ui,sans-serif; --body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:20px; --film:var(--sea); --shadow:0 18px 50px -18px rgba(0,0,0,.65); color-scheme:dark;}
#rdr *{box-sizing:border-box}
#rdr [hidden]{display:none!important}
#rdr{margin:0;background:radial-gradient(120% 70% at 20% -10%,var(--bg2),var(--bg) 60%),var(--bg);color:var(--fg);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
#rdr button,#rdr input,#rdr select,#rdr textarea{font:inherit;color:inherit}
#rdr button{cursor:pointer}
#rdr :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#rdr .glass{background:var(--glass);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);border:1px solid var(--line);box-shadow:var(--shadow)}
#rdr .app{position:relative;z-index:2;min-height:100%;display:flex;flex-direction:column;padding-inline:16px;padding-block:0 calc(96px + 0px);max-width:1240px;margin:0 auto}
#rdr .top{position:sticky;top:0px;z-index:20;display:flex;align-items:center;gap:10px;padding-block:12px 10px}
#rdr .brand{display:flex;align-items:center;gap:11px;flex:1;min-width:0}
#rdr .brand-mark{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:conic-gradient(from 210deg,var(--accent),var(--accent-2),var(--accent));color:var(--accent-ink);flex:none;box-shadow:0 8px 22px -8px var(--accent)}
#rdr .brand-mark svg{width:24px;height:24px}
#rdr .brand b{display:block;font:700 18px/1 var(--display);letter-spacing:.18em;text-transform:uppercase}
#rdr .brand small{display:block;color:var(--muted);font-size:12px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#rdr .icon-btn{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:grid;place-items:center;flex:none;position:relative}
#rdr .icon-btn svg{width:20px;height:20px}
#rdr .icon-btn .dot{position:absolute;top:7px;right:7px;width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--surface),0 0 10px var(--accent)}
#rdr .nav{position:fixed;left:12px;right:12px;bottom:calc(10px + 0px);z-index:30;max-width:560px;margin:0 auto;border-radius:22px;padding:6px;display:grid;grid-template-columns:repeat(10,minmax(0,1fr));max-width:920px}
#rdr .nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 1px 6px;color:var(--muted);font-size:10.5px;min-width:0;white-space:nowrap;font-weight:600;border-radius:16px;position:relative;letter-spacing:.01em}
#rdr .nav button svg{width:22px;height:22px}
#rdr .nav button[aria-current="page"]{color:var(--fg);background:color-mix(in srgb,var(--accent) 14%,transparent)}
#rdr .nav button[aria-current="page"] svg{color:var(--accent)}
#rdr .nav .badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font:700 10.5px/18px var(--mono)}
#rdr h1,#rdr h2,#rdr h3{text-wrap:balance;margin:0}
#rdr .h1{font:700 28px/1.08 var(--display);letter-spacing:-.02em}
#rdr .h2{font:650 20px/1.15 var(--display);letter-spacing:-.01em}
#rdr .eyebrow{font:600 10.5px/1 var(--body);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
#rdr .muted{color:var(--muted)}
#rdr .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
#rdr .hint{color:var(--muted);font-size:13.5px;margin:0}
#rdr .panel{background:var(--glass);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
#rdr .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line2);background:var(--raise);font-weight:650;font-size:14.5px;text-decoration:none;color:var(--fg)}
#rdr .btn svg{width:18px;height:18px;flex:none}
#rdr .btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;color:var(--accent-ink);box-shadow:0 10px 24px -10px var(--accent)}
#rdr .btn.ghost{background:transparent}
#rdr .btn.sm{min-height:36px;padding:0 14px;font-size:13.5px}
#rdr .btn.block{width:100%}
#rdr .btn:disabled{opacity:.6;cursor:default}
#rdr .btn.wa{background:#1FAF5A;border-color:#1FAF5A;color:#fff}
#rdr .row{display:flex;gap:8px;flex-wrap:wrap}
#rdr .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
#rdr .stack{display:flex;flex-direction:column;gap:10px}
#rdr .chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--glass);font-size:13px;font-weight:600;white-space:nowrap}
#rdr .chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
#rdr .chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
#rdr .chips::-webkit-scrollbar{display:none}
#rdr .pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
#rdr .pot-alto{background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accent)}
#rdr .pot-medio{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
#rdr .pot-bajo{background:color-mix(in srgb,var(--muted) 18%,transparent);color:var(--muted)}
#rdr .et{background:color-mix(in srgb,var(--sea) 18%,transparent);color:var(--sea)}
#rdr .et.cliente{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
#rdr .et.descartado{background:color-mix(in srgb,var(--muted) 16%,transparent);color:var(--muted)}
#rdr .et.respondio,#rdr .et.cotizado{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
#rdr .fld{display:flex;flex-direction:column;gap:6px;min-width:0}
#rdr .fld>span{font-size:12.5px;font-weight:650;color:var(--muted)}
#rdr .fld input,#rdr .fld select,#rdr .fld textarea{width:100%;min-width:0;padding:11px 13px;border-radius:13px;border:1px solid var(--line2);background:var(--raise)}
#rdr .fld textarea{resize:vertical;min-height:90px;line-height:1.45}
#rdr .fld input:focus,#rdr .fld select:focus,#rdr .fld textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
#rdr .search{position:relative}
#rdr .search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
#rdr .search input{width:100%;padding:13px 14px 13px 42px;border-radius:999px;border:1px solid var(--line2);background:var(--glass);backdrop-filter:blur(14px)}
#rdr .view{display:flex;flex-direction:column;gap:14px;padding-block:4px 16px}
#rdr .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
#rdr .kpi{background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:16px;padding:10px 13px;min-width:0}
#rdr .kpi b{display:block;font:600 22px/1.1 var(--mono);font-variant-numeric:tabular-nums}
#rdr .kpi span{font-size:11.5px;color:var(--muted);font-weight:600}
#rdr .kpi.hot b{color:var(--accent)}
#rdr .map3d{position:fixed;inset:0;z-index:0;background:#07111c}
#rdr .map3d canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
#rdr .m3-labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#rdr .m3-lbl{position:absolute;left:0;top:0;pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;padding:0;color:#fff;will-change:transform}
#rdr .m3-lbl .m3-t{font:600 11px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;text-shadow:0 1px 3px rgba(0,0,0,.9),0 0 8px rgba(0,0,0,.6);white-space:nowrap}
#rdr .m3-lbl .m3-n{display:none}
#rdr .m3-lbl.tiene .m3-n{display:grid;place-items:center;min-width:30px;height:30px;padding:0 8px;border-radius:999px;background:linear-gradient(135deg,#2F80F7,#8CC9FF);color:#FFFFFF;font:700 14px/1 var(--mono);box-shadow:0 6px 18px -4px rgba(47,128,247,.8),0 0 0 2px rgba(255,255,255,.85)}
#rdr .m3-lbl.solo-n .m3-t{display:none}
#rdr .m3-lbl.sel .m3-t{color:#8CC9FF;font-size:13px}
#rdr .m3-lbl.sel .m3-n{transform:scale(1.15)}
#rdr .m3-city{position:absolute;left:0;top:0;font:500 11px/1 var(--body);color:rgba(255,255,255,.88);text-shadow:0 1px 3px rgba(0,0,0,.95);white-space:nowrap;padding-left:9px;pointer-events:none}
#rdr .m3-city::before{content:"";position:absolute;left:0;top:50%;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;background:#fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.6)}
#rdr .m3-ctrl{position:absolute;right:14px;display:flex;flex-direction:column;gap:8px;z-index:3;bottom:calc(var(--sheet-h,220px) + 110px + 0px)}
#rdr .m3-ctrl button{width:44px;height:44px;border-radius:14px;border:1px solid rgba(255,255,255,.18);background:rgba(10,20,30,.62);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#fff;display:grid;place-items:center;font:600 18px/1 var(--body)}
#rdr .m3-ctrl button svg{width:20px;height:20px}
#rdr .m3-hint{position:absolute;left:50%;transform:translateX(-50%);top:calc(150px + 0px);z-index:3;font-size:12px;color:rgba(255,255,255,.85);background:rgba(10,20,30,.55);backdrop-filter:blur(10px);padding:6px 12px;border-radius:999px;white-space:nowrap;pointer-events:none;transition:opacity .6s}
#rdr .m3-hint.out{opacity:0}
#rdr.en-mapa .app{pointer-events:none}
#rdr.en-mapa .app .top,#rdr.en-mapa .app .map-ui>*{pointer-events:auto}
#rdr.en-mapa{background:#07111c}
#rdr .map-ui{display:flex;flex-direction:column;gap:10px;min-height:calc(100cqh - 170px)}
#rdr .map-ui .kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
#rdr .map-ui .spacer{flex:1;pointer-events:none!important}
#rdr .sheet-prov{border-radius:24px;padding:14px 16px 16px;max-height:52cqh;overflow:auto}
#rdr .sheet-prov .grab{width:42px;height:5px;border-radius:3px;background:var(--line2);margin:0 auto 10px}
#rdr .sheet-prov.min{max-height:none;overflow:visible}
@container rdr (max-width:520px){
  #rdr .map-ui .kpis .kpi{padding:8px 10px}
  #rdr .map-ui .kpis .kpi b{font-size:18px}
  #rdr .map-ui .kpis .kpi span{font-size:10.5px}
}
@container rdr (min-width:960px){
  #rdr .map-ui{display:grid;grid-template-columns:minmax(0,1fr) 410px;grid-template-rows:auto 1fr;gap:14px;min-height:calc(100cqh - 90px)}
  #rdr .map-ui .kpis{grid-column:1;align-self:start;max-width:620px}
  #rdr .map-ui .spacer{display:none}
  #rdr .sheet-prov{grid-column:2;grid-row:1 / span 2;align-self:start;max-height:calc(100cqh - 120px)}
  #rdr .m3-ctrl{bottom:110px;right:auto;left:20px}
}
#rdr .tt-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
#rdr .seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--glass);border:1px solid var(--line);gap:4px}
#rdr .seg button{border:0;background:none;padding:8px 14px;border-radius:999px;font-weight:650;font-size:13.5px;color:var(--muted)}
#rdr .seg button[aria-selected="true"]{background:var(--fg);color:var(--bg)}
#rdr .tt-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
#rdr .tt-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
@container rdr (max-width:520px){
  #rdr .tt-list{grid-template-columns:1fr}
}
#rdr .tt{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:20px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);min-width:0}
#rdr .tt-top{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:11px;align-items:center}
#rdr .tt-av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:linear-gradient(135deg,color-mix(in srgb,var(--sea) 30%,var(--raise)),color-mix(in srgb,var(--accent) 30%,var(--raise)));border:1px solid var(--line2)}
#rdr .tt-n{min-width:0}
#rdr .tt-n b{display:block;font-size:15.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#rdr .tt-n small{display:block;color:var(--muted);font:500 12.5px/1.3 var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#rdr .tt-nums{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted)}
#rdr .tt-nums span{white-space:nowrap}
#rdr .tt-nums b{font:700 14px var(--mono);color:var(--fg);margin-right:3px}
#rdr .tt-bio{margin:0;padding:10px 12px;border-radius:13px;background:var(--raise);border:1px solid var(--line);font-size:13.5px;line-height:1.45;white-space:pre-line;overflow-wrap:anywhere}
#rdr .tt-data{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;font-size:13px;margin:0}
#rdr .tt-data dt{color:var(--muted);font-weight:600}
#rdr .tt-data dd{margin:0;overflow-wrap:anywhere}
#rdr .tt-acc{display:flex;gap:6px;flex-wrap:wrap}
#rdr .tt-acc .btn{flex:1 1 auto}
#rdr .rd-hero{display:flex;flex-direction:column;gap:14px}
#rdr .rd-hero-t{display:flex;flex-direction:column;gap:6px}
#rdr .rd-badge{align-self:flex-start;font:700 11px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;padding:6px 10px;border-radius:999px;color:#fff}
#rdr .rd-tt .rd-badge{background:linear-gradient(135deg,#111,#2b2b2b);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
#rdr .rd-fb .rd-badge{background:#1877F2}

#rdr .reg-row{display:flex;flex-direction:column;gap:8px}
#rdr .reg-list .prov-item small{display:block;font-size:11.5px;color:var(--muted);font-weight:400;margin-top:3px;line-height:1.35}
#rdr .reg-list .prov-item{align-items:flex-start;text-align:left}

/* hoja «Buscar clientes»: zona */
#rdr .zona-ops{display:flex;flex-direction:column;gap:6px}
#rdr .zona-op{display:flex;align-items:flex-start;gap:10px;padding:11px 12px;border-radius:14px;background:rgba(255,255,255,.045);border:1px solid rgba(160,195,255,.12);cursor:pointer;transition:background .2s,border-color .2s}
#rdr .zona-op:has(input:checked){background:rgba(77,163,255,.14);border-color:rgba(140,201,255,.4)}
#rdr .zona-op input{margin-top:3px;accent-color:var(--accent);flex:none}
#rdr .zona-op b{display:block;font-weight:600}
#rdr .zona-op small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px;line-height:1.4}
#rdr .zona-fija{padding:12px 14px;border-radius:14px;background:rgba(77,163,255,.12);border:1px solid rgba(140,201,255,.3)}
#rdr .zona-fija b{display:block}
#rdr .zona-fija small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
#rdr .zona-dep{display:flex;flex-direction:column;gap:8px;margin-top:8px}
#rdr .zona-dep[hidden]{display:none}
#rdr .zd-acc{gap:6px;flex-wrap:wrap;align-items:center}
#rdr .zd-acc .search{flex:1 1 200px;min-width:0}
#rdr .zd-list{display:flex;flex-direction:column;max-height:260px;overflow:auto;border-radius:14px;background:rgba(4,16,36,.4);border:1px solid rgba(160,195,255,.12);padding:4px;overscroll-behavior:contain}
#rdr .zd-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;cursor:pointer;font-size:14px}
#rdr .zd-item:hover{background:rgba(255,255,255,.05)}
#rdr .zd-item input{accent-color:var(--accent);flex:none}
#rdr .zd-item>span:first-of-type{flex:1;min-width:0}
#rdr .zd-item[hidden]{display:none}
#rdr .b-plan{margin:0;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid rgba(160,195,255,.1);line-height:1.5}
#rdr .b-plan:empty{display:none}

/* secuencias propias */
#rdr .sq-list{display:flex;flex-direction:column;gap:6px;margin-top:10px}
#rdr .sq-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.045);border:1px solid rgba(160,195,255,.1)}
#rdr .sq-tx{flex:1;min-width:0}
#rdr .sq-tx b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#rdr .sq-tx small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#rdr .sq-n{font-size:12.5px;color:var(--muted);white-space:nowrap}
#rdr .sq-n b{color:var(--fg)}
#rdr .sq-vacio{display:flex;flex-direction:column;gap:10px}
#rdr .sq-vacio .btn{align-self:flex-start}
#rdr .sq-elegir{display:flex;flex-direction:column;gap:8px}
#rdr .sq-op{all:unset;box-sizing:border-box;cursor:pointer;display:block;padding:13px 14px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid rgba(160,195,255,.14);transition:background .2s,border-color .2s}
#rdr .sq-op:hover{background:rgba(77,163,255,.12);border-color:rgba(140,201,255,.36)}
#rdr .sq-op:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
#rdr .sq-op b{display:block}
#rdr .sq-op small{display:block;color:var(--muted);font-size:12.5px;margin-top:3px}

/* encabezado fijo prolijo: el contenido pasa por debajo de un vidrio, sin pisarse con los títulos */
#rdr:not(.en-mapa) .top::before{content:"";position:absolute;inset:0 -16px -18px;z-index:-1;pointer-events:none;background:linear-gradient(180deg,rgba(7,22,46,.94) 0%,rgba(7,22,46,.86) 64%,rgba(7,22,46,0) 100%);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);-webkit-mask-image:linear-gradient(180deg,#000 66%,transparent);mask-image:linear-gradient(180deg,#000 66%,transparent)}
#rdr .reg-row .chips{flex-wrap:wrap;overflow:visible;-webkit-mask-image:none;mask-image:none}

/* Dartpac Outreach (web): el Radar comercial corre igual que dentro de Claude, pero sus capacidades

(function () {

  var cache = new Map();           // "col/id" -> {v, d}
  var colL = new Map();            // col -> Set<{cb, er}>
  var docL = new Map();            // "col/id" -> Set<{cb, er}>
  var since = 0, listo = false, corriendo = false, timer = 0, fallos = 0, listosCb = [];

  function snapCol(col) {
    var docs = [], pre = col + "/";
    cache.forEach(function (x, k) { if (x.d && k.indexOf(pre) === 0) { var id = k.slice(pre.length); docs.push({ id: id, exists: true, data: (function (d) { return function () { return d; }; })(x.d) }); } });

    var x = cache.get(k), id = k.slice(k.indexOf("/") + 1);
    return { id: id, exists: !!(x && x.d), data: function () { return x && x.d ? x.d : undefined; } };

    cols.forEach(function (c) { var s = colL.get(c); if (s) s.forEach(function (l) { try { l.cb(snapCol(c)); } catch (e) { console.error(e); } }); });
    keys.forEach(function (k) { var s = docL.get(k); if (s) s.forEach(function (l) { try { l.cb(snapDoc(k)); } catch (e) { console.error(e); } }); });
  }
  function aplicar(docs) {
    var cols = new Set(), keys = new Set();
    for (var i = 0; i < docs.length; i++) {
      var r = docs[i], k = r.c + "/" + r.id, cur = cache.get(k);
      if (cur && cur.v >= r.v) continue;

  }

    if (corriendo) return; corriendo = true;
    try {
      var j = await api("/sync?since=" + since);
      var ch = aplicar(j.docs || []);
      since = j.now || since;
      fallos = 0;

        // primera foto: avisa a todos, aunque una colección esté vacía
        colL.forEach(function (_, c) { ch.cols.add(c); });
        docL.forEach(function (_, k) { ch.keys.add(k); });

      get: async function () { if (!listo) await new Promise(function (r) { listosCb.push(r); }); return snapDoc(k); },
      set: function (d) { return escribir("set", col, id, d || {}); },
      update: function (d) { return escribir("update", col, id, d || {}); },

    id: async function () { await equipoP; return yo().senderId || "equipo"; },

    profiles: async function () { return {}; }, search: async function () { return []; }

  /* ------------------------------------------------------------------ conexiones: búsquedas con Claude y Gmail */
  var mcp = {
    callTool: async function (server, tool, input) {
      if (server === "Claude Code Remote" && tool === "fire_trigger") {
        var j = await api("/buscar", { text: String((input || {}).text || "") });

  function textoDe(input) { return typeof input === "string" ? input : (input || []).map(function (m) { return (m.role === "assistant" ? "Asistente: " : "") + m.content; }).join("\n\n"); }
  var sample = async function (input, opts) {
    opts = opts || {};
    var j = await api("/ia", { input: input, modelTier: opts.modelTier || "default" }, { signal: opts.signal });

async function tarjetaPngBlobMail(){ const im=new Image(); im.src=TARJ_PLU; await im.decode(); const cv=document.createElement("canvas"); cv.width=im.naturalWidth; cv.height=im.naturalHeight; cv.getContext("2d").drawImage(im,0,0); return await new Promise(r=>cv.toBlob(r,"image/png")); }

function enviarConTarjeta(blob,texto,waUrl){ const nom="Tarjeta "+(S.cfg.firmaNombre||S.cfg.empresa||"")+".jpg";
  if(tactil()){ let f=null; try{ f=new File([blob],nom,{type:"image/jpeg"}); }catch(e){}
    if(f&&navigator.canShare&&navigator.canShare({files:[f]})){ try{ navigator.clipboard&&navigator.clipboard.writeText(texto).catch(()=>{}); }catch(e){}
      navigator.share({files:[f],text:texto}).then(()=>toast("Listo: revisá en WhatsApp y enviá")).catch(err=>{ if(err&&err.name==="AbortError") return; plan2(); }); return; }
    plan2(); return; }
  // computadora: copiar la imagen y abrir WhatsApp con el texto
  let ok=false; try{ if(window.ClipboardItem&&navigator.clipboard&&navigator.clipboard.write){ navigator.clipboard.write([new ClipboardItem({"image/png":tarjetaPngBlob()})]).then(()=>toast("Imagen copiada: en WhatsApp pegala con Ctrl+V y enviá"),()=>plan2()); ok=true; } }catch(e){}
  if(waUrl) window.open(waUrl,"_blank","noopener"); if(!ok) plan2();
  async function plan2(){ try{ await navigator.clipboard.writeText(texto); }catch(e){}
    let dl=null; try{ dl=await window.claude.use("downloads"); }catch(e){}
    if(dl){ try{ await dl.save({filename:nom,data:blob}); toast("El mensaje quedó copiado: pegalo junto con la imagen"); }catch(e){} }
    else toast("No se pudo adjuntar la imagen desde acá: descargala en Speech y adjuntala"); } }

/* ---------- calidad de datos ---------- */
function calidad(p){ const prob=[]; const t=String(p.telefono||""), w=String(p.whatsapp||"");
  [["Teléfono",t],["WhatsApp",w]].forEach(([l,v])=>{ if(!v) return; const n=waNum(v); if(!n) prob.push(l+" incompleto o con formato raro"); });
  if(p.email){ if(!esMail(p.email)) prob.push("Email mal escrito"); else if(p.emailRebotado) prob.push("El email rebotó");
  }
  if(p.web&&DIRECTORIOS.test(p.web)) prob.push("La web es un directorio, no la de la empresa");
  if(/a confirmar/i.test(p.ciudad||"")) prob.push("Ciudad a confirmar");
  const cel=/(^|\D)15[\s-]?\d|\+?54\s?9|^9\s?\d{2,4}/.test(t+" "+w)||(w&&w!==t);
  return {prob, cel}; }
function esCliente(p){ const L=S.excl||[]; const n=nomNorm(p.nombre); return !!n&&L.includes(n); }

  if((p.etapa||"nuevo")==="descartado") return {n:0,partes:[["Descartado",0]]};

  P.push([REVENTA.includes(r)?"Revende (compra seguido)":VOLUMEN.includes(r)?"Rubro de mucho volumen":["gastronomia","catering","carniceria","panaderia","mercado"].includes(r)?"Consumo fijo todo el año":"Otro rubro", REVENTA.includes(r)?25:VOLUMEN.includes(r)?20:["gastronomia","catering","carniceria","panaderia","mercado"].includes(r)?15:8]);
  P.push(["Potencial "+(p.potencial||"medio"),{alto:20,medio:12,bajo:5}[p.potencial]??10]);
  const Q=calidad(p); let c=0; if(waNum(p.whatsapp||p.telefono)) c+=Q.cel?15:11; if(esMail(p.email)&&!p.emailRebotado) c+=8; if(p.web&&!DIRECTORIOS.test(p.web)) c+=4; c=Math.min(25,c);

  P.push([["caba","bsas"].includes(p.provincia)?"Zona de reparto propio":"Interior por expreso",["caba","bsas"].includes(p.provincia)?10:6]);
  const seg=Math.max(+((p.tiktok||{}).seguidores)||0,+((p.instagram||{}).seguidores)||0,+((p.facebook||{}).seguidores)||0);
  if(seg>=10000) P.push(["Mucha llegada en redes",5]); else if(seg>=1000) P.push(["Activo en redes",3]);
  if(p.competidor) P.push(["Le compra a "+p.competidor,8]);
  const et=p.etapa||"nuevo"; if(et==="respondio") P.push(["Respondió",12]); if(et==="cotizado") P.push(["Ya cotizado",15]);
  if(Q.prob.length) P.push(["Datos para revisar",-Math.min(12,Q.prob.length*5)]);
  if(esCliente(p)) P.push(["Ya es cliente de DARTPAC",-30]);
  const n=Math.max(0,Math.min(100,P.reduce((s,x)=>s+x[1],0)));
  return {n,partes:P}; }

function origenDe(p){ if(p.canal==="tiktok"||/tiktok\.com/i.test(p.fuente||"")) return "TikTok"; if(p.canal==="instagram"||/instagram\.com/i.test(p.fuente||"")) return "Instagram"; if(p.canal==="facebook"||/facebook\.com/i.test(p.fuente||"")) return "Facebook";

function vTablero(){ const per=S.tbP||30, desde=per?Date.now()-per*864e5:0, P=S.P, en=t=>t&&t>=desde;
  const ets=p=>(p.historial||[]).filter(h=>h.tipo==="etapa"||h.tipo==="contacto");
  const llego=(p,k)=>{ const o=ETAPAS.map(e=>e[0]); if(o.indexOf(p.etapa||"nuevo")<o.indexOf(k)) return false; const e=ets(p).find(h=>new RegExp(ETN[k]).test(h.texto||"")); const t=e?e.t:(k==="cliente"?p.clienteEl:0)||p.actualizado||p.creado; return en(t); };
  const enc=P.filter(p=>en(p.creado)), cont=P.filter(p=>en(primerC(p))), msgs=P.reduce((s,p)=>s+(p.historial||[]).filter(h=>(h.tipo==="envio"||h.tipo==="mail")&&en(h.t)).length,0);
  const resp=P.filter(p=>llego(p,"respondio")), cot=P.filter(p=>llego(p,"cotizado")), cli=P.filter(p=>llego(p,"cliente")), fact=cli.reduce((s,p)=>s+(+p.montoVenta||0),0);
  const money=n=>"$ "+Math.round(n).toLocaleString("es-AR");
  const kp=(l,v,s,cls)=>`<div class="stat ${cls||""}"><span>${l}</span><b class="num">${v}</b><small>${s}</small></div>`;
  /* semanas */
  const W=12, lunes=d=>{ const x=new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x.getTime(); }, w0=lunes(Date.now())-(W-1)*7*864e5;
  const bins=Array.from({length:W},(_,i)=>({t:w0+i*7*864e5,m:0,r:0}));
  P.forEach(p=>{ (p.historial||[]).forEach(h=>{ if((h.tipo==="envio"||h.tipo==="mail")&&h.t>=w0){ const i=Math.floor((h.t-w0)/(7*864e5)); if(bins[i]) bins[i].m++; } }); const e=ets(p).find(h=>/Respondi|respondi/.test(h.texto||"")); if(e&&e.t>=w0){ const i=Math.floor((e.t-w0)/(7*864e5)); if(bins[i]) bins[i].r++; } });
  const mx=Math.max(1,...bins.map(b=>b.m)), H=150, BW=100/W;
  const chart=`<svg class="tb-chart" viewBox="0 0 100 ${H/1.5}" preserveAspectRatio="none" role="img" aria-label="Mensajes enviados y respuestas por semana">${[0.5,1].map(f=>`<line x1="0" x2="100" y1="${(H/1.5-6)*(1-f)+2}" y2="${(H/1.5-6)*(1-f)+2}" class="tb-grid"/>`).join("")}${bins.map((b,i)=>{ const h1=(H/1.5-8)*b.m/mx, h2=(H/1.5-8)*b.r/mx; return `<rect x="${i*BW+BW*0.16}" width="${BW*0.34}" y="${H/1.5-4-h1}" height="${Math.max(h1,b.m?0.8:0)}" class="tb-m" rx="0.6"><title>Semana del ${new Date(b.t).toLocaleDateString("es-AR",{day:"numeric",month:"short"})}: ${b.m} mensajes</title></rect><rect x="${i*BW+BW*0.52}" width="${BW*0.34}" y="${H/1.5-4-h2}" height="${Math.max(h2,b.r?0.8:0)}" class="tb-r" rx="0.6"><title>${b.r} respuestas</title></rect>`; }).join("")}</svg>
   <div class="tb-x">${bins.map((b,i)=>`<span>${i%3===0||i===W-1?new Date(b.t).toLocaleDateString("es-AR",{day:"numeric",month:"short"}):""}</span>`).join("")}</div><div class="tb-leg"><span><i class="tb-m"></i>Mensajes enviados</span><span><i class="tb-r"></i>Respuestas</span><span class="muted">máx. ${mx} por semana</span></div>`;
  const tabla=(tit,clave)=>{ const g={}; P.forEach(p=>{ const k=clave(p)||"Sin dato"; const o=g[k]=g[k]||{e:0,c:0,r:0,cl:0,f:0}; if(en(p.creado)) o.e++; if(en(primerC(p))) o.c++; if(llego(p,"respondio")) o.r++; if(llego(p,"cliente")){ o.cl++; o.f+=+p.montoVenta||0; } });
    const F=Object.entries(g).filter(([,o])=>o.e||o.c||o.r||o.cl).sort((a,b)=>b[1].cl-a[1].cl||b[1].r-a[1].r||b[1].c-a[1].c||b[1].e-a[1].e).slice(0,12);
    return `<div class="panel"><div class="sec-h" style="margin:0 0 10px"><h2>${tit}</h2></div>${F.length?`<div class="ax-tw"><table class="ax-tbl"><thead><tr><th></th><th>Encontrados</th><th>Contactados</th><th>Respondieron</th><th>% resp.</th><th>Clientes</th><th>Facturado</th></tr></thead><tbody>${F.map(([k,o])=>`<tr><th scope="row">${esc(k)}</th><td class="num">${o.e}</td><td class="num">${o.c}</td><td class="num">${o.r}</td><td class="num">${o.c?pct(o.r,o.c)+"%":"—"}</td><td class="num">${o.cl}</td><td class="num">${o.f?money(o.f):"—"}</td></tr>`).join("")}</tbody></table></div>`:`<p class="hint">Sin movimiento en este período.</p>`}</div>`; };
  const vend=p=>p.asignado||((p.historial||[]).filter(h=>h.tipo==="envio"||h.tipo==="mail"||h.tipo==="contacto").map(h=>h.por).filter(Boolean).pop())||"";
  return `<section class="view">${cabecera("Resultados","Tablero comercial",per?`Últimos ${per} días`:"Desde el principio",`<div class="seg">${[[7,"7 días"],[30,"30 días"],[90,"90 días"],[0,"Todo"]].map(([v,t])=>`<button data-act="tbP" data-v="${v}" aria-selected="${per===v}">${t}</button>`).join("")}</div>`)}
   <div class="stat-grid tb-kpis">${kp("Encontrados",enc.length,"empresas nuevas")}${kp("Contactados",cont.length,"primer mensaje")}${kp("Mensajes",msgs,"mails y WhatsApp")}${kp("Respondieron",resp.length,cont.length?pct(resp.length,cont.length)+"% de respuesta":"—")}${kp("Cotizados",cot.length,"con precio enviado")}${kp("Clientes",cli.length,cont.length?pct(cli.length,cont.length)+"% de conversión":"nuevos","hot")}${kp("Facturado",fact?money(fact):"—","primeras compras","hot")}${kp("En secuencia",S.P.filter(seqActiva).length,"avanzando solas")}</div>
   <div class="panel"><div class="sec-h" style="margin:0 0 10px"><h2>Actividad por semana</h2><span class="hint">últimas 12 semanas</span></div>${chart}</div>

   <p class="hint">La facturación sale de la primera compra que cargás al marcar un cliente. «Respondieron» cuenta a los que llegaron a esa etapa en el período.</p></section>`; }

  pegarResp:d=>pegarRespuesta(d.id), altaGestion:d=>altaSheet(d.id),
  noContactar:async d=>{ const p=pById(d.id); if(!p) return; const v=!p.noContactar; const upd=v?{noContactar:{t:Date.now(),motivo:"Lo marcaste vos"},proximo:"",actualizado:Date.now()}:{noContactar:{__delete__:true},actualizado:Date.now()};
    if(v&&p.seq&&!p.seq.fin) upd.seq=Object.assign({},p.seq,{fin:"baja"}); if(await guardar(()=>S.db.doc("prospectos/"+p.id).update(v?upd:{noContactar:null,actualizado:Date.now()}),v?"No se lo contacta más":"Se puede volver a contactar")){ Object.assign(p,v?upd:{noContactar:null}); ver(d.id); } },
  ncQuitar:async d=>{ const p=pById(d.id); if(p&&await guardar(()=>S.db.doc("prospectos/"+p.id).update({noContactar:null,actualizado:Date.now()}),"Quitado de «No contactar»")){ p.noContactar=null; render(); } },
  alCalc:d=>{ const c=alertasCalc().find(x=>x.k===d.k); if(!c) return; if(c.tab) return ACT.tab({tab:c.tab}); if(c.sub) return ACT.axTab({t:c.sub}); if(c.acc==="seqSumar") return seqIniciar(c.ids); S.listaIds=c.ids; S.lEst="todos"; S.tab="lista"; LS.set("tab","lista"); render(); RSCROLL.scrollTo(0,0); },
  alBuscar:()=>pedirAuto("alertas",[]), alDescartar:async d=>{ if(await guardar(()=>S.db.doc("alertas/"+d.id).update({estado:"descartada"}),"Descartada")) render(); }, alAgregar:d=>{ const a=(S.AL||[]).find(x=>x.id===d.id); if(a) alAgregar(a); },
  enriquecer:()=>{ const L=S.P.filter(p=>vivoP(p)&&(calidad(p).prob.length||(!p.telefono&&!p.whatsapp&&!esMail(p.email)))).sort(ordenPt).slice(0,25); if(!L.length) return toast("No hay fichas para completar"); pedirAuto("enriquecer",L.map(p=>p.id)); },
  enriquecer1:d=>pedirAuto("enriquecer",[d.id]),
  dupUnir:d=>unirDup(String(d.ids).split(",")), dupTodos:async()=>{ const G=duplicados(); if(Date.now()-(ACT._dupT||0)>8000){ ACT._dupT=Date.now(); toast("Se van a unir "+G.length+" grupos de fichas repetidas. Tocá «Unir todas» de nuevo para confirmar."); return; } ACT._dupT=0; for(const g of G) await unirDup(g.map(p=>p.id)); },
  vendNuevo:()=>vendSheet(null), vendEditar:d=>vendSheet(+d.i), vendBorrar:async d=>{ const W=(S.cfg.vendedores||[]).filter((_,i)=>i!==+d.i); if(await guardar(()=>S.db.doc("config/empresa").update({vendedores:W}),"Vendedor quitado")){ S.cfg.vendedores=W; render(); } }, vendAsignar:()=>vendAsignar(),
  fAsig:d=>{ S.fAsig=S.fAsig===d.v?"":d.v; render(); }, ordenL:d=>{ S.ordenL=d.v; LS.set("ordenL",d.v); render(); }, quitarIds:()=>{ S.listaIds=null; render(); }
});
document.addEventListener("change",async e=>{ const el=e.target; if(!el||!el.matches) return;
  if(el.matches(".fx-sel")){ const p=pById(el.dataset.id); if(!p) return; const k=el.dataset.k, v=el.value; if(await guardar(()=>S.db.doc("prospectos/"+p.id).update({[k]:v,actualizado:Date.now()}),"Guardado")) p[k]=v; return; }
  if(el.matches(".ax-sel")){ const h=(S.resp||[])[+el.dataset.i]; if(h){ h.clase=el.value; pintarResp($("#ax-resp")); } return; }
  if(el.matches("[data-chk]")){ const ch=Object.assign({},S.cfg.checks||{},{[el.dataset.chk]:el.checked}); const upd={checks:ch}; if(el.dataset.chk==="calent"&&el.checked&&!S.cfg.mailInicio) upd.mailInicio=Date.now(); if(await guardar(()=>S.db.doc("config/empresa").update(upd),"")) Object.assign(S.cfg,upd); return; }
  if(el.id==="sg-baja"){ const v=el.checked; if(await guardar(()=>S.db.doc("config/empresa").update({bajaOn:v}),v?"Se agrega la línea de baja":"Sin línea de baja")) S.cfg.bajaOn=v; } });
document.addEventListener("click",e=>{ const a=e.target.closest&&e.target.closest("a[data-alerta]"); if(a&&S.db) S.db.doc("alertas/"+a.dataset.alerta).update({estado:"vista",contactado:Date.now()}).catch(()=>{}); });

$("#btn-cfg").onclick=ajustes; $("#btn-buscar").onclick=busquedas;
RROOT.addEventListener("toggle",e=>{ const t=e.target; if(t&&t.matches&&t.matches("details.deps")) S.depsOpen=t.open; },true);
RROOT.addEventListener("input",e=>{ const t=e.target; if(!t||t.id!=="dep-q") return; S.depQ=t.value; const q=norm(t.value); RROOT.querySelectorAll(".dep-item").forEach(b=>b.hidden=!!q&&!String(b.dataset.q||"").includes(q)); });
window.__radarShown=()=>{ RROOT.__tab=null; render(); };
window.__radarData=()=>({P:S.P,SQ:S.SQ||[],B:S.B,AL:S.AL,cfg:S.cfg,listo:S.listo,sinDb:S.sinDb,depDeP,ADM}); window.__radarProv=PROV;
window.__radarHidden=()=>{ if(MAP3D.ok()) MAP3D.mostrar(false); };
/* abrir una sección del Radar desde una notificación de Outreach */
window.__radarIr=a=>{ if(!a) return; try{
  if(a.prov){ if(S.tab!=="mapa"){ S.tab="mapa"; LS.set("tab","mapa"); } cerrar(); ACT.prov({prov:a.prov}); return; }
  if(a.ax){ cerrar(); ACT.axTab({t:a.ax}); return; }
  if(a.k){ cerrar(); ACT.alCalc({k:a.k}); return; }
  if(a.ver){ if(S.tab==="mapa"){ S.tab="lista"; LS.set("tab","lista"); render(); } ver(a.ver); return; }
  if(a.tab){ if(a.mlF) S.mlF=a.mlF; ACT.tab({tab:a.tab}); }
}catch(e){} };
render(); iniciar();
})();
};
/* arranca ya, oculto: así Outreach tiene los avisos y los números; el mapa 3D se arma recién al abrir el Radar */
window.__radarBoot();
</script>
